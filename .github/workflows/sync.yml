name: Scheduled Metabase Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Fetch Script
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_USER: ${{ secrets.METABASE_USER }}
          METABASE_PASS: ${{ secrets.METABASE_PASS }}
          CARD_IOL: ${{ secrets.CARD_IOL }}
          CARD_NOT_RACKED: ${{ secrets.CARD_NOT_RACKED }}
          CARD_LIVE_NF: ${{ secrets.CARD_LIVE_NF }}
          CARD_AUDIT: ${{ secrets.CARD_AUDIT }}
          CARD_RACKOUT: ${{ secrets.CARD_RACKOUT }}
        run: python fetch_metabase.py

      - name: Push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-update raw data" && git push)
